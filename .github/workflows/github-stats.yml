name: Update GitHub Stats SVG

on:
  schedule:
    # Aligned with IST active hours (08:00 AM IST & 10:00 PM IST; silent during 10:00 PM - 08:00 AM IST quiet hours)
    - cron: '30 2 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Kolkata

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set timezone to Indian Standard Time (Asia/Kolkata)
        run: sudo timedatectl set-timezone Asia/Kolkata

      - name: Generate Radical-theme github-stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TZ: Asia/Kolkata
        run: python3 .github/scripts/generate_stats.py

      - name: Commit and push github-stats.svg if changed
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(stats): update github-stats.svg [skip ci]"
            git push
          else
            echo "github-stats.svg is already up to date."
          fi
